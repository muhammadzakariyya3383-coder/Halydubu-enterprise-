<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="BizFlow - Universal Business Management Platform">
<title>BizFlow — Universal Business Management Platform</title>

<style>
:root{
  --primary:#0f766e;
  --primary-dark:#115e59;
  --primary-light:#ccfbf1;
  --bg:#f4f7f8;
  --card:#ffffff;
  --text:#17202a;
  --muted:#64748b;
  --border:#e2e8f0;
  --danger:#dc2626;
  --danger-light:#fee2e2;
  --warning:#d97706;
  --warning-light:#fef3c7;
  --success:#15803d;
  --success-light:#dcfce7;
  --info:#2563eb;
  --info-light:#dbeafe;
  --shadow:0 8px 30px rgba(15,23,42,.07);
  --radius:16px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{display:none!important}

.app-shell{
  min-height:100vh;
}

/* LOGIN */
.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top right,rgba(20,184,166,.16),transparent 35%),
    linear-gradient(135deg,#f8fafc,#ecfdf5);
}

.login-card{
  width:100%;
  max-width:440px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px;
  box-shadow:0 20px 60px rgba(15,23,42,.12);
}

.logo-box{
  width:68px;
  height:68px;
  border-radius:18px;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:24px;
  margin-bottom:18px;
}

.login-card h1{
  margin:0;
  font-size:30px;
}

.login-card p{
  color:var(--muted);
  margin:8px 0 25px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
  font-size:14px;
}

.form-control{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  border-radius:11px;
  padding:12px 13px;
  outline:none;
  transition:.2s;
}

.form-control:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(15,118,110,.10);
}

.btn{
  border:0;
  border-radius:11px;
  padding:11px 15px;
  font-weight:750;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary-dark);
}

.btn-secondary{
  background:#eef2f7;
  color:#334155;
}

.btn-danger{
  background:var(--danger);
  color:#fff;
}

.btn-success{
  background:var(--success);
  color:#fff;
}

.btn-warning{
  background:var(--warning);
  color:#fff;
}

.btn-small{
  padding:7px 10px;
  font-size:12px;
}

.login-note{
  margin-top:18px;
  padding:12px;
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:12px;
  font-size:12px;
  color:var(--muted);
}

/* LAYOUT */
.main-layout{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:260px;
  background:#0f172a;
  color:#fff;
  position:fixed;
  inset:0 auto 0 0;
  z-index:100;
  overflow-y:auto;
  transition:.25s;
}

.brand{
  padding:23px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand strong{
  display:block;
  font-size:21px;
}

.brand span{
  display:block;
  color:#94a3b8;
  font-size:12px;
  margin-top:3px;
}

.nav{
  padding:15px 10px;
}

.nav-section{
  color:#64748b;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:12px 10px 6px;
}

.nav button{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#cbd5e1;
  padding:11px 12px;
  border-radius:10px;
  margin:2px 0;
}

.nav button:hover,
.nav button.active{
  background:#134e4a;
  color:#fff;
}

.content-area{
  margin-left:260px;
  width:calc(100% - 260px);
  min-width:0;
}

.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:50;
}

.menu-toggle{
  display:none;
  border:0;
  background:#eef2f7;
  border-radius:9px;
  padding:8px 11px;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.user-pill{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  border:1px solid var(--border);
  border-radius:12px;
  font-size:13px;
}

.avatar{
  width:32px;
  height:32px;
  background:var(--primary-light);
  color:var(--primary-dark);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.page{
  padding:24px;
  max-width:1700px;
  margin:auto;
}

.page-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:22px;
}

.page-header h2{
  margin:0;
  font-size:26px;
}

.page-header p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:14px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

/* CARDS */
.grid{
  display:grid;
  gap:16px;
}

.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
}

.card h3{
  margin:0 0 15px;
  font-size:17px;
}

.stat-card{
  position:relative;
  overflow:hidden;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:650;
}

.stat-value{
  font-size:27px;
  font-weight:850;
  margin-top:8px;
}

.stat-icon{
  position:absolute;
  right:15px;
  top:15px;
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--primary-light);
  color:var(--primary-dark);
}

.quick-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.quick-actions button{
  padding:15px 10px;
  border:1px dashed #cbd5e1;
  background:#f8fafc;
  border-radius:12px;
  font-weight:750;
  color:#334155;
}

.quick-actions button:hover{
  border-color:var(--primary);
  background:var(--primary-light);
  color:var(--primary-dark);
}

/* TABLE */
.table-wrap{
  overflow:auto;
  border:1px solid var(--border);
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,td{
  padding:11px 12px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.3px;
}

tr:last-child td{
  border-bottom:0;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.badge-success{background:var(--success-light);color:var(--success)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.badge-info{background:var(--info-light);color:var(--info)}
.badge-neutral{background:#f1f5f9;color:#475569}

/* POS */
.pos-layout{
  display:grid;
  grid-template-columns:1.4fr .9fr;
  gap:16px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-top:15px;
}

.product-tile{
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
  background:#fff;
  text-align:left;
}

.product-tile:hover{
  border-color:var(--primary);
  background:#f0fdfa;
}

.product-tile strong{
  display:block;
  margin-bottom:5px;
}

.product-tile span{
  color:var(--muted);
  font-size:12px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:6px;
}

.qty-btn{
  width:28px;
  height:28px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:7px;
}

.total-box{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  margin-top:12px;
}

.total-row{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
}

.total-row.final{
  border-top:1px solid var(--border);
  margin-top:8px;
  padding-top:12px;
  font-weight:900;
  font-size:18px;
}

/* SEARCH */
.search-row{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.search-row .form-control{
  flex:1;
}

/* MODAL */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  border-bottom:1px solid var(--border);
}

.modal-header h3{
  margin:0;
}

.modal-close{
  border:0;
  background:#f1f5f9;
  width:34px;
  height:34px;
  border-radius:9px;
}

.modal-body{
  padding:18px;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:15px 18px;
  border-top:1px solid var(--border);
}

/* TOAST */
.toast-container{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:2000;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  min-width:270px;
  max-width:380px;
  padding:13px 15px;
  border-radius:12px;
  background:#0f172a;
  color:#fff;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
  animation:slideIn .2s ease;
}

.toast.success{background:#166534}
.toast.error{background:#991b1b}
.toast.warning{background:#92400e}

@keyframes slideIn{
  from{transform:translateY(10px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

/* EMPTY */
.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

/* REPORT */
.report-number{
  font-size:22px;
  font-weight:850;
}

.progress{
  height:8px;
  background:#e2e8f0;
  border-radius:999px;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  background:var(--primary);
}

/* RECEIPT */
.receipt{
  max-width:430px;
  margin:auto;
  background:#fff;
  padding:25px;
  color:#111;
}

.receipt h2{
  text-align:center;
  margin:0;
}

.receipt-center{text-align:center}
.receipt-line{
  border-top:1px dashed #888;
  margin:14px 0;
}

.receipt-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:4px 0;
}

/* MOBILE */
@media(max-width:1000px){
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pos-layout{grid-template-columns:1fr}
}

@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .content-area{
    margin-left:0;
    width:100%;
  }

  .menu-toggle{
    display:block;
  }

  .topbar{
    padding:0 13px;
  }

  .page{
    padding:15px;
  }

  .page-header{
    flex-direction:column;
  }

  .grid-4,
  .grid-3,
  .grid-2{
    grid-template-columns:1fr;
  }

  .quick-actions{
    grid-template-columns:repeat(2,1fr);
  }

  .product-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .user-pill .user-role{
    display:none;
  }
}

@media(max-width:500px){
  .login-card{
    padding:23px;
  }

  .login-card h1{
    font-size:25px;
  }

  .topbar{
    height:62px;
  }

  .page-header h2{
    font-size:22px;
  }

  .quick-actions{
    grid-template-columns:1fr 1fr;
  }

  .product-grid{
    grid-template-columns:1fr;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }
}

@media print{
  body *{
    visibility:hidden!important;
  }

  #printArea,
  #printArea *{
    visibility:visible!important;
  }

  #printArea{
    position:absolute;
    left:0;
    top:0;
    width:100%;
  }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastContainer" class="toast-container"></div>

<script>
"use strict";

/* =========================================================
   BIZFLOW MVP
   Universal Business Management Platform
   Prototype Release
   ========================================================= */

const DB_KEY = "BIZFLOW_MVP_2_DATABASE";
const SESSION_KEY = "BIZFLOW_MVP_2_SESSION";

const DEFAULT_DB = {
  meta:{
    version:"2.0",
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString()
  },

  business:{
    name:"My Business",
    phone:"",
    email:"",
    address:"",
    currency:"₦",
    taxRate:0
  },

  users:[
    {
      id:"u_owner",
      name:"Administrator",
      email:"admin",
      phone:"",
      password:"Admin@2026!",
      role:"Owner",
      status:"Active",
      createdAt:new Date().toISOString()
    }
  ],

  customers:[
    {
      id:"c_walkin",
      name:"Walk-in Customer",
      phone:"",
      email:"",
      address:"",
      openingBalance:0,
      createdAt:new Date().toISOString()
    },
    {
      id:"c_aisha",
      name:"Aisha Bello",
      phone:"08000000000",
      email:"",
      address:"",
      openingBalance:0,
      createdAt:new Date().toISOString()
    },
    {
      id:"c_musa",
      name:"Musa Ibrahim",
      phone:"08111111111",
      email:"",
      address:"",
      openingBalance:0,
      createdAt:new Date().toISOString()
    }
  ],

  products:[
    {
      id:"p_rice",
      name:"Rice 10kg",
      sku:"RICE10",
      category:"Food",
      price:18000,
      cost:15000,
      stock:25,
      reorderLevel:5,
      unit:"bag",
      status:"Active",
      createdAt:new Date().toISOString()
    },
    {
      id:"p_oil",
      name:"Vegetable Oil",
      sku:"OIL5",
      category:"Food",
      price:9500,
      cost:7800,
      stock:18,
      reorderLevel:5,
      unit:"bottle",
      status:"Active",
      createdAt:new Date().toISOString()
    },
    {
      id:"p_sugar",
      name:"Sugar 1kg",
      sku:"SUGAR1",
      category:"Food",
      price:2200,
      cost:1700,
      stock:40,
      reorderLevel:10,
      unit:"pack",
      status:"Active",
      createdAt:new Date().toISOString()
    }
  ],

  sales:[],
  payments:[],
  expenses:[],
  inventoryMovements:[],
  auditLogs:[],
  notifications:[]
};

/* =========================================================
   DATABASE
   ========================================================= */

let db = loadDB();
let currentUser = null;
let currentPage = "dashboard";
let cart = [];
let editingId = null;

function deepClone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function loadDB(){
  try{
    const saved = localStorage.getItem(DB_KEY);

    if(!saved){
      const fresh = deepClone(DEFAULT_DB);
      localStorage.setItem(DB_KEY,JSON.stringify(fresh));
      return fresh;
    }

    const parsed = JSON.parse(saved);

    return {
      ...deepClone(DEFAULT_DB),
      ...parsed,
      business:{...deepClone(DEFAULT_DB.business),...(parsed.business||{})},
      users:Array.isArray(parsed.users)?parsed.users:[],
      customers:Array.isArray(parsed.customers)?parsed.customers:[],
      products:Array.isArray(parsed.products)?parsed.products:[],
      sales:Array.isArray(parsed.sales)?parsed.sales:[],
      payments:Array.isArray(parsed.payments)?parsed.payments:[],
      expenses:Array.isArray(parsed.expenses)?parsed.expenses:[],
      inventoryMovements:Array.isArray(parsed.inventoryMovements)?parsed.inventoryMovements:[],
      auditLogs:Array.isArray(parsed.auditLogs)?parsed.auditLogs:[],
      notifications:Array.isArray(parsed.notifications)?parsed.notifications:[]
    };
  }catch(error){
    console.error(error);
    return deepClone(DEFAULT_DB);
  }
}

function saveDB(){
  db.meta.updatedAt = new Date().toISOString();
  localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function uid(prefix="id"){
  return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
}

function nowISO(){
  return new Date().toISOString();
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(value){
  const amount = Number(value)||0;
  return `${escapeHTML(db.business.currency||"₦")}${amount.toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}

function dateTime(value){
  if(!value) return "-";
  return new Date(value).toLocaleString("en-NG",{
    dateStyle:"medium",
    timeStyle:"short"
  });
}

function todayKey(){
  return new Date().toISOString().slice(0,10);
}

function generateReference(prefix){
  return `${prefix}-${new Date().getFullYear()}-${Math.random().toString(36).slice(2,8).toUpperCase()}`;
}

/* =========================================================
   AUTHENTICATION
   ========================================================= */

function getSession(){
  try{
    return JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null");
  }catch{
    return null;
  }
}

function login(username,password){
  const user = db.users.find(u =>
    String(u.email||"").toLowerCase()===String(username||"").toLowerCase() &&
    u.password===password &&
    u.status==="Active"
  );

  if(!user){
    showToast("Invalid login details or inactive account.","error");
    return;
  }

  currentUser = {...user};

  sessionStorage.setItem(
    SESSION_KEY,
    JSON.stringify({
      userId:user.id,
      loginAt:nowISO()
    })
  );

  audit("LOGIN","Authentication","Successful login");

  renderApp();
}

function logout(){
  if(currentUser){
    audit("LOGOUT","Authentication","User logged out");
  }

  sessionStorage.removeItem(SESSION_KEY);
  currentUser = null;
  cart = [];
  renderApp();
}

/* =========================================================
   ROLES / PERMISSIONS
   ========================================================= */

const ROLE_PERMISSIONS = {
  Owner:["*"],

  SuperAdmin:[
    "dashboard.view","sales.view","sales.create","customers.view","customers.manage",
    "products.view","products.manage","inventory.view","inventory.manage",
    "expenses.view","expenses.manage","debts.view","payments.create",
    "reports.view","users.manage","audit.view","settings.manage","backup.manage"
  ],

  Manager:[
    "dashboard.view","sales.view","sales.create","customers.view","customers.manage",
    "products.view","products.manage","inventory.view","inventory.manage",
    "expenses.view","expenses.manage","debts.view","payments.create",
    "reports.view","audit.view"
  ],

  Accountant:[
    "dashboard.view","sales.view","customers.view","debts.view","payments.create",
    "expenses.view","expenses.manage","reports.view","audit.view"
  ],

  Cashier:[
    "dashboard.view","sales.view","sales.create","customers.view","customers.manage",
    "payments.create"
  ],

  "Inventory Manager":[

function hasPermission(permission){
  if(!currentUser) return false;

  const permissions = ROLE_PERMISSIONS[currentUser.role] || [];

  return permissions.includes("*") || permissions.includes(permission);
}

function requirePermission(permission){
  if(!hasPermission(permission)){
    showToast("You do not have permission to perform this action.","error");
    return false;
  }
  return true;
}

   ========================================================= */

function audit(action,module,details){
  if(!db.auditLogs) db.auditLogs=[];

  db.auditLogs.unshift({
    id:uid("audit"),
    userId:currentUser?.id||"system",
    userName:currentUser?.name||"System",
    action,
    module,
    details,
    timestamp:nowISO()
  });

  if(db.auditLogs.length>2000){
    db.auditLogs=db.auditLogs.slice(0,2000);
  }

  saveDB();
}

/* =========================================================
   BUSINESS CALCULATIONS
   ========================================================= */

function saleTotal(sale){
  return Number(sale.total)||0;
}

function totalSales(){
  return db.sales.reduce((sum,s)=>sum+saleTotal(s),0);
}

function totalPaid(){
  return db.payments.reduce((sum,p)=>sum+(Number(p.amount)||0),0);
}

function totalExpenses(){
  return db.expenses.reduce((sum,e)=>sum+(Number(e.amount)||0),0);
}

function customerSales(customerId){
  return db.sales
    .filter(s=>s.customerId===customerId)
    .reduce((sum,s)=>sum+saleTotal(s),0);
}

function customerPayments(customerId){
  return db.payments
    .filter(p=>p.customerId===customerId)
    .reduce((sum,p)=>sum+(Number(p.amount)||0),0);
}

function customerBalance(customer){
  const opening=Number(customer.openingBalance)||0;
  return opening+customerSales(customer.id)-customerPayments(customer.id);
}

function getTodaySales(){
  return db.sales
    .filter(s=>s.createdAt?.slice(0,10)===todayKey())
    .reduce((sum,s)=>sum+saleTotal(s),0);
}

function getTodayExpenses(){
  return db.expenses
    .filter(e=>e.createdAt?.slice(0,10)===todayKey())
    .reduce((sum,e)=>sum+(Number(e.amount)||0),0);
}

function getTotalOutstanding(){
  return db.customers.reduce((sum,c)=>sum+Math.max(0,customerBalance(c)),0);
}

function getProfit(){
  return db.sales.reduce((profit,s)=>{
    const revenue=s.items.reduce((a,item)=>a+(Number(item.price)||0)*(Number(item.qty)||0),0);
    const cost=s.items.reduce((a,item)=>{
      const product=db.products.find(p=>p.id===item.productId);
      return a+(Number(product?.cost)||0)*(Number(item.qty)||0);
    },0);

    return profit+(revenue-cost);
  },0)-totalExpenses();
}

function lowStockProducts(){
  return db.products.filter(p=>
    p.status==="Active" &&
    Number(p.stock)<=Number(p.reorderLevel)
  );
}

function showPage(page){
  currentPage=page;

  const titles={
    dashboard:"Dashboard",
    sales:"Sales / Point of Sale",
    customers:"Customers",
    products:"Products",
    inventory:"Inventory",
    expenses:"Expenses",
    debts:"Debts & Receivables",
    reports:"Reports",
    users:"Users & Roles",
    audit:"Audit History",
    settings:"Business Settings"
  };

  document.getElementById("pageTitle").textContent=titles[page]||"BizFlow";

  document.querySelectorAll(".nav button").forEach(btn=>{
    btn.classList.remove("active");
  });

  const content=document.getElementById("pageContent");

  if(!content) return;

  switch(page){
    case"dashboard":renderDashboard(content);break;
    case"sales":renderSales(content);break;
    case"customers":renderCustomers(content);break;
    case"products":renderProducts(content);break;
    case"inventory":renderInventory(content);break;
    case"expenses":renderExpenses(content);break;
    case"debts":renderDebts(content);break;
    case"reports":renderReports(content);break;
    case"users":renderUsers(content);break;
    case"audit":renderAudit(content);break;
    case"settings":renderSettings(content);break;
    default:renderDashboard(content);
  }

  const sidebar=document.getElementById("sidebar");
  if(window.innerWidth<=800) sidebar?.classList.remove("open");
}

function addToCart(productId){

  if(!requirePermission("sales.create")) return;

  const product=db.products.find(p=>p.id===productId);

  if(!product){
    showToast("Product not found.","error");
    return;
  }

  if(Number(product.stock)<=0){
    showToast("This product is out of stock.","warning");
    return;
  }

  const existing=cart.find(i=>i.productId===productId);

  if(existing){
    if(existing.qty+1>Number(product.stock)){
      showToast("Quantity exceeds available stock.","warning");
      return;
    }

    existing.qty++;
  }else{
    cart.push({
      productId,
      name:product.name,
      price:Number(product.price)||0,
      qty:1
    });
  }

  refreshCart();
}

function changeCartQty(productId,change){
  const item=cart.find(i=>i.productId===productId);
  const product=db.products.find(p=>p.id===productId);

  if(!item || !product) return;

  const newQty=item.qty+change;

  if(newQty<=0){
    cart=cart.filter(i=>i.productId!==productId);
  }else if(newQty>Number(product.stock)){
    showToast("Quantity exceeds available stock.","warning");
    return;
  }else{
    item.qty=newQty;
  }

  refreshCart();
}

function cartHTML(){

  if(!cart.length){
    return `<div class="empty">Cart is empty.</div>`;
  }

  return cart.map(item=>`
    <div class="cart-item">
      <div>
        <strong>${escapeHTML(item.name)}</strong>
        <div style="font-size:12px;color:#64748b">
          ${money(item.price)} each
        </div>
      </div>

      <div class="cart-controls">
        <button class="qty-btn"
          onclick="changeCartQty('${item.productId}',-1)">−</button>
        <strong>${item.qty}</strong>
        <button class="qty-btn"
          onclick="changeCartQty('${item.productId}',1)">+</button>
      </div>
    </div>
  `).join("");
}

function refreshCart(){

  const area=document.getElementById("cartArea");

  if(area) area.innerHTML=cartHTML();

  const subtotal=cart.reduce((sum,i)=>sum+i.price*i.qty,0);

  const discount=Math.max(
    0,
    Number(document.getElementById("saleDiscount")?.value)||0
  );

  const total=Math.max(0,subtotal-discount);

  const paid=Math.max(
    0,
    Number(document.getElementById("salePaid")?.value)||0
  );

  const balance=Math.max(0,total-paid);
  const change=Math.max(0,paid-total);

  const summary=document.getElementById("cartSummary");

  if(summary){
    summary.innerHTML=`
      <div class="total-box">
        <div class="total-row">
          <span>Subtotal</span>
          <strong>${money(subtotal)}</strong>
        </div>

        <div class="total-row">
          <span>Discount</span>
          <strong>${money(discount)}</strong>
        </div>

        <div class="total-row final">
          <span>Total</span>
          <strong>${money(total)}</strong>
        </div>

        <div class="total-row">
          <span>Balance</span>
          <strong>${money(balance)}</strong>
        </div>

        <div class="total-row">
          <span>Change</span>
          <strong>${money(change)}</strong>
        </div>
      </div>
    `;
  }
}

function completeSale(){

  if(!requirePermission("sales.create")) return;

  if(!cart.length){
    showToast("Add at least one product.","warning");
    return;
  }

  const customerId=document.getElementById("saleCustomer")?.value;
  const customer=db.customers.find(c=>c.id===customerId);

  if(!customer){
    showToast("Select a valid customer.","error");
    return;
  }

  const discount=Math.max(
    0,
    Number(document.getElementById("saleDiscount")?.value)||0
  );

  const paid=Math.max(
    0,
    Number(document.getElementById("salePaid")?.value)||0
  );

  const paymentMethod=document.getElementById("salePaymentMethod")?.value||"Cash";

  const subtotal=cart.reduce((sum,i)=>sum+i.price*i.qty,0);
  const total=Math.max(0,subtotal-discount);

  if(paid>total){
    showToast("Amount received cannot exceed the sale total in this MVP.","warning");
    return;
  }

  /* Validate stock before changing anything */
  for(const item of cart){
    const product=db.products.find(p=>p.id===item.productId);

    if(!product){
      showToast("A product in the cart no longer exists.","error");
      return;
    }

    if(Number(product.stock)<Number(item.qty)){
      showToast(`${product.name} does not have enough stock.`,"error");
      return;
    }
  }

  const reference=generateReference("SAL");

  const sale={
    id:uid("sale"),
    reference,
    customerId:customer.id,
    customerName:customer.name,
    items:deepClone(cart),
    subtotal,
    discount,
    total,
    amountPaid:paid,
    balance:Math.max(0,total-paid),
    paymentMethod,
    createdBy:currentUser.id,
    createdAt:nowISO()
  };

  /*
    Transaction sequence:
    1. Validate sale
    2. Create sale
    3. Reduce stock
    4. Record inventory movement
    5. Record payment
    6. Audit
  */

  db.sales.unshift(sale);

  for(const item of cart){

    const product=db.products.find(p=>p.id===item.productId);

    product.stock=Number(product.stock)-Number(item.qty);

    db.inventoryMovements.unshift({
      id:uid("mov"),
      productId:product.id,
      productName:product.name,
      type:"SALE",
      quantity:-Number(item.qty),
      reference,
      userId:currentUser.id,
      timestamp:nowISO()
    });
  }

  if(paid>0){
    db.payments.unshift({
      id:uid("pay"),
      reference:generateReference("PAY"),
      saleId:sale.id,
      customerId:customer.id,
      customerName:customer.name,
      amount:paid,
      method:paymentMethod,
      createdBy:currentUser.id,
      createdAt:nowISO()
    });
  }

  saveDB();

  audit(
    "CREATE",
    "Sales",
    `Sale ${reference} created for ${customer.name} — ${money(total)}`
  );

  const savedSale=deepClone(sale);

  cart=[];

  showToast("Sale completed successfully.","success");

  openReceipt(savedSale);
  showPage("sales");
}

function saveProduct(){

  if(!requirePermission("products.manage")) return;

  const form=document.getElementById("productForm");

  if(!form.reportValidity()) return;

  const data=Object.fromEntries(new FormData(form).entries());

  const duplicate=db.products.find(p=>
    String(p.sku||"").trim() &&
    String(data.sku||"").trim() &&
    String(p.sku).toLowerCase()===String(data.sku).toLowerCase() &&
    p.id!==editingId
  );

  if(duplicate){
    showToast("SKU already exists.","warning");
    return;
  }

  if(editingId){

    const p=db.products.find(x=>x.id===editingId);

    Object.assign(p,{
      name:data.name.trim(),
      sku:data.sku.trim(),
      category:data.category.trim(),
      unit:data.unit.trim(),
      price:Math.max(0,Number(data.price)||0),
      cost:Math.max(0,Number(data.cost)||0),
      reorderLevel:Math.max(0,Number(data.reorderLevel)||0)
    });

    audit("UPDATE","Products",`Product ${p.name} updated`);
  }else{

    const product={
      id:uid("prod"),
      name:data.name.trim(),
      sku:data.sku.trim(),
      category:data.category.trim(),
      unit:data.unit.trim()||"unit",
      price:Math.max(0,Number(data.price)||0),
      cost:Math.max(0,Number(data.cost)||0),
      stock:Math.max(0,Number(data.stock)||0),
      reorderLevel:Math.max(0,Number(data.reorderLevel)||0),
      status:"Active",
      createdAt:nowISO()
    };

    db.products.unshift(product);

    audit("CREATE","Products",`Product ${product.name} created`);
  }

  saveDB();
  closeModal();
  showPage("products");
  showToast("Product saved.","success");
}

function deleteProduct(id){

  if(!requirePermission("products.manage")) return;

  const p=db.products.find(x=>x.id===id);

  if(!p) return;

  const used=db.sales.some(s=>s.items.some(i=>i.productId===id));

function openStockModal(id){

    "Inventory Adjustment",

          </select>

            min="0"

            class="form-control">

            placeholder="e.g. Opening stock, damaged, correction">
        </div>

      </form>
    `,

    `

function adjustStock(id){

  if(!requirePermission("inventory.manage")) return;

  const p=db.products.find(x=>x.id===id);

  if(!p) return;

  const form=document.getElementById("stockForm");

  if(!form.reportValidity()) return;

  const data=Object.fromEntries(new FormData(form).entries());

  const quantity=Math.max(0,Number(data.quantity)||0);

  let newStock=Number(p.stock)||0;

  if(data.type==="ADD"){
    newStock+=quantity;
  }else if(data.type==="REMOVE"){
    if(quantity>newStock){
      showToast("Cannot remove more stock than available.","error");
      return;
    }
    newStock-=quantity;
  }else{
    newStock=quantity;
  }

  const difference=newStock-Number(p.stock);

  p.stock=newStock;

  db.inventoryMovements.unshift({
    id:uid("mov"),
    productId:p.id,
    productName:p.name,
    type:"ADJUSTMENT",
    quantity:difference,
    reference:data.reason||"Manual adjustment",
    userId:currentUser.id,
    timestamp:nowISO()
  });

  saveDB();

  audit(
    "UPDATE",
    "Inventory",
    `${p.name} stock changed from ${p.stock-difference} to ${newStock}`
  );

  closeModal();
  showPage("inventory");
  showToast("Inventory updated.","success");
}

function savePayment(customerId){

  if(!requirePermission("payments.create")) return;

  const c=db.customers.find(x=>x.id===customerId);

  if(!c) return;

  const balance=Math.max(0,customerBalance(c));

  const form=document.getElementById("paymentForm");

  if(!form.reportValidity()) return;

  const data=Object.fromEntries(new FormData(form).entries());

  const amount=Math.max(0,Number(data.amount)||0);

  if(amount<=0 || amount>balance){
    showToast("Payment amount is greater than the outstanding balance.","warning");
    return;
  }

  db.payments.unshift({
    id:uid("pay"),
    reference:generateReference("PAY"),
    customerId:c.id,
    customerName:c.name,
    amount,
    method:data.method,
    note:data.note.trim(),
    createdBy:currentUser.id,
    createdAt:nowISO()
  });

  saveDB();

  audit(
    "CREATE",
    "Payments",
    `Payment received from ${c.name} — ${money(amount)}`
  );

  closeModal();
  showPage("debts");
  showToast("Payment recorded.","success");
}

function saveUser(){

  if(!requirePermission("users.manage")) return;

  const form=document.getElementById("userForm");

  if(!form.reportValidity()) return;

  const data=Object.fromEntries(new FormData(form).entries());

  const username=data.email.trim().toLowerCase();

  const duplicate=db.users.find(u=>
    u.email.toLowerCase()===username &&
    u.id!==editingId
  );

  if(duplicate){
    showToast("Username already exists.","warning");
    return;
  }

  if(editingId){

    const u=db.users.find(x=>x.id===editingId);

    if(!u) return;

    u.name=data.name.trim();
    u.email=username;
    u.role=data.role;
    u.status=data.status;

    if(data.password){
      u.password=data.password;
    }

    audit("UPDATE","Users",`User ${u.name} updated`);
  }else{

    if(data.password.length<8){
      showToast("Password must contain at least 8 characters.","warning");
      return;
    }

    const user={
      id:uid("user"),
      name:data.name.trim(),
      email:username,
      password:data.password,
      role:data.role,
      status:data.status,
      createdAt:nowISO()
    };

    db.users.unshift(user);

    audit("CREATE","Users",`User ${user.name} created`);
  }

  saveDB();
  closeModal();
  showPage("users");
  showToast("User saved.","success");
}

function deleteUser(id){

  if(!requirePermission("users.manage")) return;

  const u=db.users.find(x=>x.id===id);

  if(!u) return;

  if(u.id===currentUser.id){
    showToast("You cannot delete your current account.","warning");
    return;
  }

  if(!confirm(`Delete ${u.name}?`)) return;

  db.users=db.users.filter(x=>x.id!==id);

  saveDB();

  audit("DELETE","Users",`User ${u.name} deleted`);

  showPage("users");
  showToast("User deleted.","success");
}

function backupDatabase(){

  if(!requirePermission("backup.manage")){
    showToast("You do not have permission to export backups.","error");
    return;
  }

  const payload={
    product:"BizFlow",
    version:"2.0",
    exportedAt:nowISO(),
    database:db
  };

  const blob=new Blob(
    [JSON.stringify(payload,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download=`bizflow-backup-${todayKey()}.json`;
  a.click();

  URL.revokeObjectURL(url);

  audit("EXPORT","Backup","Database backup exported");

  showToast("Backup exported.","success");
}

function restoreDatabase(event){

  if(!requirePermission("backup.manage")) return;

  const file=event.target.files?.[0];

  if(!file) return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{

      const parsed=JSON.parse(reader.result);

      const incoming=parsed.database||parsed;

      if(!incoming || !Array.isArray(incoming.users)){
        throw new Error("Invalid BizFlow backup.");
      }

      if(!confirm(
        "Restore this backup? Current browser data will be replaced."
      )){
        event.target.value="";
        return;
      }

      db=incoming;

      saveDB();

      audit("IMPORT","Backup","Database backup restored");

      showToast("Backup restored successfully.","success");

      renderApp();

    }catch(error){
      console.error(error);
      showToast("Invalid or corrupted backup file.","error");
    }

    event.target.value="";
  };

  reader.readAsText(file);
}

function resetDatabase(){

  if(!requirePermission("backup.manage")){
    showToast("You do not have permission to reset the database.","error");
    return;
  }

  const confirmation=prompt(
    "Type RESET to restore the demo database:"
  );

  if(confirmation!=="RESET"){
    showToast("Reset cancelled.","warning");
    return;
  }

  db=deepClone(DEFAULT_DB);

  saveDB();

  audit("RESET","Database","Demo database reset");

  showToast("Demo database reset.","success");

  renderApp();
}

    </div>
  `;

  document.getElementById("loginForm").addEventListener("submit",event=>{
    event.preventDefault();

    login(
      document.getElementById("loginUsername").value.trim(),
      document.getElementById("loginPassword").value
    );
  });
}

/* =========================================================
   KEYBOARD / UX
   ========================================================= */

document.addEventListener("keydown",event=>{

  if(event.key==="Escape"){
    closeModal();
  }

});

/* =========================================================
   START
   ========================================================= */

renderApp();

</script>
